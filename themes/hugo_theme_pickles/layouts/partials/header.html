<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
{{ partial "head.html" . }}
<body>
  <a href="#main" class="skip-link p-screen-reader-text">Skip to content</a>
  {{ partial "svgpack-sprite.html" . }}
  <header class="l-header">
    <button id="theme-toggle" class="c-theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" class="c-theme-toggle__icon c-theme-toggle__icon--sun"><use xlink:href="#icon-sun"></use></svg>
      <svg viewBox="0 0 24 24" class="c-theme-toggle__icon c-theme-toggle__icon--moon"><use xlink:href="#icon-moon"></use></svg>
    </button>
    {{ if .IsPage }}
    <p class="c-title p-title"><a href="{{ .Site.BaseURL }}" class="p-title__link">{{ .Site.Title }}</a></p>
    {{ else }}
    <h1 class="c-title p-title"><a href="{{ .Site.BaseURL }}" class="p-title__link">{{ .Site.Title }}</a></h1>
    {{ end }}
    {{ with .Site.Params.subtitle }}
    <p class="p-subtitle">
      {{ . }}
    </p>
    {{ end }}
  </header>
  <div class="main-container">
  <main id="main" class="l-main">
